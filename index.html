  let goalDraft = null;
  const GOAL_KIND = { time: '⏱️ по времени', sum: '💰 накопление', measure: '📏 замер' };
  const GOAL_TPLS = {
    adult: [
      ['sleep', '😴', 'Режим сна', 'Сдвигать отбой понемногу, чтобы высыпаться к подъёму'],
      ['weight', '⚖️', 'Снизить вес', 'Замер каждый день, план и прогноз даты'],
      ['money', '💰', 'Накопить сумму', 'Откладывать каждый день равную часть'],
      ['time', '⏱️', 'Своё время', 'Ступенчато сдвинуть подъём, начало работы и т. п.'],
      ['sum', '📚', 'Своё накопление', 'Страницы, километры, часы практики'],
      ['measure', '📏', 'Свой замер', 'Пульс, давление, обхват — любой показатель'],
    ],
    // для школьника нет целей на вес: детям это не нужно
    school: [
      ['sleep', '😴', 'Режим сна', 'Ложиться понемногу раньше, чтобы высыпаться перед школой'],
      ['grade', '📝', 'Подтянуть оценку', 'Средний балл по предмету: вносите, когда он меняется'],
      ['sport', '💪', 'Спортивный рекорд', 'Подтягивания, отжимания, прыжки — шаг за шагом'],
      ['dream', '💰', 'Накопить на мечту', 'Откладывать часть карманных денег'],
      ['sum', '📚', 'Прочитать книгу', 'По несколько страниц каждый день'],
      ['time', '⏱️', 'Своё время', 'Например, вставать раньше без будильника родителей'],
      ['measure', '📏', 'Свой замер', 'Любой показатель, который хочется улучшить'],
    ],
  };
  const nval = (x) => Number(String(x ?? '').replace(',', '.').replace(/\s/g, ''));
  const hm = (m) => `${Math.floor(m / 60)} ч${m % 60 ? ' ' + (m % 60) + ' мин' : ''}`;

  function goalTemplate(id) {
    const p = state.profile;
    const wake = toMin(p.wake) ?? toMin('07:00'), sleepH = nval(p.sleepH) || MODES[state.mode || 'adult'].sleepH;
    if (id === 'sleep') {
      const to = fmtMin(wake - sleepH * 60);
      const bedHabit = state.habits.find((h) => !h.archived && /спать до/i.test(h.name));
      return { tpl: id, type: 'time', title: `Подъём в ${fmtMin(wake)}: отбой в ${to}`, sphere: 'health', from: toMin(p.bed) ? fmtMin(toMin(p.bed)) : '23:30', to, days: 10,
        label: 'Лечь спать до {v}', habit: `Лёг спать до ${to}`, archiveHabit: bedHabit ? bedHabit.id : '', archiveOn: true };
    }
    if (id === 'weight') {
      const w = nval(p.weight) || 95, h = nval(p.height);
      let to = Math.round(w - 5);
      if (h) { const upper = Math.floor(25 * (h / 100) ** 2); if (w > upper) to = Math.max(upper, to); }
      return { tpl: id, type: 'measure', title: `Снизить вес до ${to} кг`, sphere: 'health', unit: 'кг', from: w, to, days: Math.ceil(((w - to) / 0.5) * 7), label: 'Вес сегодня', habit: '' };
    }
    if (id === 'money') return { tpl: id, type: 'sum', title: 'Накопить 5000 ₽', sphere: 'money', unit: '₽', to: 5000, days: 10, label: 'Отложить {v} на цель', habit: 'Отложил немного денег' };
    if (id === 'time') return { tpl: id, type: 'time', title: `Вставать в ${fmtMin(wake - 30)}`, sphere: 'health', from: fmtMin(wake), to: fmtMin(wake - 30), days: 10, label: 'Встать в {v}', habit: `Встал в ${fmtMin(wake - 30)}` };
    if (id === 'sum') return { tpl: id, type: 'sum', title: isSchool() ? 'Прочитать книгу: 300 страниц' : 'Прочитать 300 страниц', sphere: 'mind', unit: 'стр.', to: 300, days: 30, label: 'Прочитать {v}', habit: isSchool() ? 'Читал 20 минут' : '' };
    if (id === 'grade') return { tpl: id, type: 'measure', title: 'Средний балл по математике: 4,5', sphere: 'work', unit: 'балл', from: 3.8, to: 4.5, days: 60, label: 'Средний балл сейчас', habit: '' };
    if (id === 'sport') return { tpl: id, type: 'measure', title: 'Подтянуться 10 раз', sphere: 'health', unit: 'раз', from: 3, to: 10, days: 60, label: 'Подтянулся сегодня, раз', habit: 'Тренировка подтягиваний' };
    if (id === 'dream') return { tpl: id, type: 'sum', title: 'Накопить на мечту: 3000 ₽', sphere: 'money', unit: '₽', to: 3000, days: 30, label: 'Отложить {v} на мечту', habit: 'Отложил часть карманных' };
    if (isSchool()) return { tpl: 'measure', type: 'measure', title: 'Пробежать 1 км быстрее 5 минут', sphere: 'health', unit: 'мин', from: 6, to: 5, days: 45, label: 'Время на 1 км', habit: '' };
    return { tpl: 'measure', type: 'measure', title: 'Пульс в покое до 65', sphere: 'health', unit: 'уд/мин', from: 75, to: 65, days: 60, label: 'Пульс утром', habit: '' };
  }

  // проверка и приведение черновика цели; { err } или { ok: цель без id }
  function draftParsed() {
    const g = goalDraft, days = Math.round(nval(g.days));
    const base = { type: g.type, title: String(g.title || '').trim(), sphere: g.sphere, days, label: String(g.label || '').trim(), habit: String(g.habit || '').trim() };
    if (!base.title) return { err: 'Введите название цели' };
    if (!(days >= 1 && days <= 3650)) return { err: 'Срок — целое число дней, от 1' };
    if (g.type === 'time') {
      const a = toMin(g.from), b = toMin(g.to);
      if (a === null || b === null) return { err: 'Время пишется как ЧЧ:ММ, например 23:30' };
      if (a === b) return { err: 'Время «сейчас» и цель совпадают' };
      if (!base.label.includes('{v}')) return { err: 'В задании дня нужен {v}: туда подставится время шага' };
      return { ok: { ...base, from: fmtMin(a), to: fmtMin(b) } };
    }
    if (g.type === 'sum') {
      const to = nval(g.to);
      if (!(to > 0)) return { err: 'Укажите, сколько всего нужно набрать' };
      if (!base.label.includes('{v}')) return { err: 'В задании дня нужен {v}: туда подставится порция' };
      const raw = to / days;
      return { ok: { ...base, to, unit: String(g.unit || '').trim(), step: raw >= 1 ? Math.ceil(raw) : Math.ceil(raw * 10) / 10 } };
    }
    const from = nval(g.from), to = nval(g.to);
    if (!isFinite(from) || !isFinite(to) || String(g.from).trim() === '' || String(g.to).trim() === '') return { err: 'Укажите текущее значение и цель числами' };
    if (from === to) return { err: 'Текущее значение и цель совпадают' };
    return { ok: { ...base, from, to, unit: String(g.unit || '').trim(), label: base.label || 'Замер' } };
  }

  function goalPreview() {
    const r = draftParsed();
    if (r.err) return `<span class="warn">${esc(r.err)}</span>`;
    const g = r.ok, end = fmtDay(addDays(todayKey(), g.days - 1), { day: 'numeric', month: 'long' });
    const lines = [];
    if (g.type === 'time') {
      const a = toMin(g.from), b = toMin(g.to), per = Math.abs(b - a) / g.days;
      const steps = [1, 2, 3].filter((i) => i < g.days).map((i) => fmtMin(goalStepVal(g, i)));
      if (goalDraft.tpl === 'sleep') lines.push(`Подъём ${state.profile.wake || '07:00'} − ${nval(state.profile.sleepH) || MODES[state.mode || 'adult'].sleepH} ч сна = отбой в <b>${g.to}</b>.`);
      lines.push(`Каждый день на <b>${num(per, per % 1 ? 1 : 0)} мин ${b < a ? 'раньше' : 'позже'}</b>: ${steps.join(', ')}${steps.length ? ' … ' : ''}${g.to}.`);
      if (per > 15) lines.push('<span class="warn">⚠️ Больше 15 минут за день — организму тяжело перестроиться. Лучше увеличить срок.</span>');
    } else if (g.type === 'sum') {
      lines.push(`По <b>${fmtNum(g.step)} ${esc(g.unit)}</b> в день. Задание дня: «${esc(goalStepText(g, fmtNum(g.step) + ' ' + g.unit))}».`);
    } else {
      const perWeek = Math.abs(g.to - g.from) / g.days * 7;
      lines.push(`Примерно <b>${num(perWeek, perWeek < 10 ? 2 : 0)} ${esc(g.unit)} в неделю</b>. Вносите новое значение, когда оно меняется: будет виден план и прогноз даты.`);
      if (/кг/i.test(g.unit) && g.to < g.from) {
        const safe = g.from * 0.01;
        if (perWeek > safe) lines.push(`<span class="warn">⚠️ Быстрее безопасного темпа (около 1% веса в неделю, то есть ${num(safe, 1)} кг). Рекомендуемый срок: от ${Math.ceil((g.from - g.to) / safe * 7)} дней.</span>`);
        const h = nval(state.profile.height);
        if (h) lines.push(`ИМТ сейчас ${num(g.from / (h / 100) ** 2, 1)}, на цели ${num(g.to / (h / 100) ** 2, 1)} (норма 18,5–25).`);
      }
    }
    lines.push(g.type === 'measure'
      ? `Срок: <b>${end}</b>. Прогноз даты считается по вашему фактическому темпу.`
      : `Финиш по плану: <b>${end}</b>. Пропуск задания сдвигает срок на день.`);
    return lines.join('<br>');
  }

  function goalForm() {
    const g = goalDraft;
    if (!g) return '';
    const f = (name, label, val, wide) => `<label${wide ? ' class="wide-f"' : ''}>${label}<input type="text" data-gf="${name}" value="${esc(val ?? '')}" maxlength="100"></label>`;
    const sphereSel = `<label>Сфера<select data-gf="sphere">${state.spheres.map((s) => `<option value="${s.id}"${s.id === g.sphere ? ' selected' : ''}>${s.icon} ${esc(s.name)}</option>`).join('')}</select></label>`;
    let fields = f('title', 'Название цели', g.title, true);
    if (g.type === 'time') fields += f('from', 'Сейчас (ЧЧ:ММ)', g.from) + f('to', 'Цель (ЧЧ:ММ)', g.to) + f('days', 'За сколько дней', g.days) + sphereSel + f('label', 'Задание дня ({v} — время шага)', g.label, true);
    else if (g.type === 'sum') fields += f('to', 'Сколько всего', g.to) + f('unit', 'Единица', g.unit) + f('days', 'За сколько дней', g.days) + sphereSel + f('label', 'Задание дня ({v} — порция)', g.label, true);
    else fields += f('from', 'Сейчас', g.from) + f('to', 'Цель', g.to) + f('unit', 'Единица', g.unit) + f('days', 'Срок, дней', g.days) + sphereSel + f('label', 'Подпись замера', g.label, true);
    fields += f('habit', 'После достижения закрепить привычкой (необязательно)', g.habit, true);
    const ah = g.archiveHabit && habitById(g.archiveHabit);
    if (ah) fields += `<label class="wide-f" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" data-gf="archiveOn" ${g.archiveOn ? 'checked' : ''} style="width:auto">
      Убрать привычку «${esc(ah.name)}» в архив: цель её заменит</label>`;
    return `<form class="gform" id="goalForm"><div class="set-grid">${fields}</div>
      <div class="preview" id="goalPreview">${goalPreview()}</div>
      <div class="row" style="margin-top:12px"><button class="btn primary" type="submit">🎯 Поставить цель</button><button class="btn" type="button" data-act="goalCancel">Отмена</button></div></form>`;
  }

  function profileInfo() {
    const p = state.profile, out = [];
    const h = nval(p.height), w = nval(p.weight), age = nval(p.age);
    if (isSchool()) {
      // у школьника вес и ИМТ не считаем: детские нормы зависят от возраста, это вопрос к врачу, а не к трекеру
      if (nval(p.grade) > 0) out.push(`🎒 ${fmtNum(nval(p.grade))} класс. Учёба — главная работа, но спорт, сон и семья важны не меньше.`);
    } else if (h > 0 && w > 0) {
      const bmi = w / (h / 100) ** 2;
      const cat = bmi < 18.5 ? 'недостаток веса' : bmi < 25 ? 'норма' : bmi < 30 ? 'избыточный вес' : 'ожирение';
      out.push(`⚖️ ИМТ <b>${num(bmi, 1)}</b>: ${cat}. Здоровый вес при росте ${fmtNum(h)} см: ${Math.ceil(18.5 * (h / 100) ** 2)}–${Math.floor(25 * (h / 100) ** 2)} кг.`);
    }
    const wake = toMin(p.wake), bed = toMin(p.bed), sh = nval(p.sleepH);
    if (wake !== null && bed !== null && sh > 0) {
      const now = (wake + (wake <= bed ? 1440 : 0)) - bed, need = fmtMin(wake - sh * 60), diff = now - sh * 60;
      out.push(`😴 Сейчас вы спите <b>${hm(now)}</b>. Чтобы спать ${fmtNum(sh)} ч и вставать в ${fmtMin(wake)}, ложиться нужно в <b>${need}</b>${diff < 0 ? ` (на ${-diff} мин раньше)` : diff > 0 ? `, а у вас даже ${diff} мин запаса` : ''}.`);
    }
    if (age > 0) out.push(`🛏️ Рекомендуемый сон для вашего возраста: ${age < 13 ? '9–12' : age < 18 ? '8–10' : age < 65 ? '7–9' : '7–8'} ч.`);
    return out.join('<br>') || '<span class="muted">Заполните поля, и здесь появятся подсказки для целей.</span>';
  }

  function goalCard({ g, info }) {
    const m = info.medal ? MEDALS[info.medal] : null;
    const habitExists = state.habits.some((h) => h.name === g.habit);
    return `<div class="gcard">
      <div class="top">${m ? `<span class="medal" title="${m[1]}">${m[0]}</span>` : ''}<b>${sphere(g.sphere).icon} ${esc(g.title)}</b><span class="kind">${GOAL_KIND[g.type]}</span></div>
      <div class="bar"><i style="width:${info.progress * 100}%;background:${color(g.sphere)}"></i></div>
      <div class="meta">${goalProgressText(g, info)} · ${Math.round(info.progress * 100)}%${g.type === 'time' ? ` · шагов ${info.steps} из ${g.days}` : ''}</div>
      <div class="goal-term">Старт ${fmtShort(g.start)} · ${goalTermText(g, info)}</div>
      <div class="acts">
        ${info.doneAt && g.habit && !habitExists ? `<button class="btn small primary" data-act="goalHabit" data-id="${g.id}">📌 Закрепить привычкой «${esc(g.habit)}»</button>` : ''}
        ${info.active ? `<button class="btn small" data-act="goalDrop" data-id="${g.id}">Отказаться</button>` : ''}
        ${g.status === 'dropped' && !info.doneAt ? `<button class="btn small" data-act="goalRestore" data-id="${g.id}">Вернуть в работу</button>` : ''}
        <button class="btn small danger" data-act="goalDelete" data-id="${g.id}">Удалить</button>
      </div>
    </div>`;
  }

  function viewGoals() {
    const infos = state.goals.map((g) => ({ g, info: goalInfo(g) }));
    const active = infos.filter((x) => x.info.active);
    const done = infos.filter((x) => x.info.doneAt).sort((x, y) => y.info.doneAt.localeCompare(x.info.doneAt));
    const dropped = infos.filter((x) => x.g.status === 'dropped' && !x.info.doneAt);
    const mc = (m) => done.filter((x) => x.info.medal === m).length;
    const p = state.profile;
    const pf = (k, label, ph) => `<label>${label}<input type="text" data-prof="${k}" value="${esc(p[k] ?? '')}" placeholder="${ph}"></label>`;
    return `<div class="grid g2">
      <section class="card wide">
        <div class="stats">
          <div class="stat"><b>${active.length}</b><span>в работе</span></div>
          <div class="stat"><b>${done.length}</b><span>достигнуто</span></div>
          <div class="stat"><b>${mc('gold')}</b><span>из них в срок</span></div>
          <div class="stat"><b>🥇${mc('gold')} 🥈${mc('silver')} 🥉${mc('bronze')}</b><span>медали</span></div>
        </div>
      </section>

      <section class="card">
        <h2>Профиль</h2>
        <p class="lead">Исходные данные: из них считаются подсказки и стартовые значения целей.</p>
        <div class="prof">
          ${isSchool() ? pf('age', 'Возраст', '12') + pf('grade', 'Класс', '6') : pf('age', 'Возраст', '35') + pf('height', 'Рост, см', '180') + pf('weight', 'Вес, кг', '95')}
          ${pf('wake', 'Обычно встаю', '07:00')}${pf('bed', 'Обычно ложусь', '23:30')}${pf('sleepH', 'Хочу спать, ч', '8')}
        </div>
        <div class="preview">${profileInfo()}</div>
      </section>

      <section class="card" id="newGoal">
        <h2>Новая цель</h2>
        <p class="lead">Выберите шаблон: поля заполнятся из профиля, всё можно поправить.</p>
        <div class="tpls">${GOAL_TPLS[state.mode || 'adult'].map(([id, ic, nm, ds]) => `<button class="tpl${goalDraft && goalDraft.tpl === id ? ' on' : ''}" data-act="goalTpl" data-t="${id}"><b>${ic} ${nm}</b><span>${ds}</span></button>`).join('')}</div>
        ${goalForm()}
      </section>

      <section class="card wide">
        <h2>В работе</h2>
        ${active.length ? `<div class="gcards" style="margin-top:10px">${active.map(goalCard).join('')}</div>` : '<p class="muted">Активных целей нет. Поставьте первую: её задания появятся на экране «Сегодня».</p>'}
      </section>

      ${done.length ? `<section class="card wide"><h2>Достигнутые цели</h2><p class="lead">🥇 в срок · 🥈 с опозданием до ${'20%'} срока · 🥉 позже.</p><div class="gcards">${done.map(goalCard).join('')}</div></section>` : ''}
      ${dropped.length ? `<section class="card wide"><details><summary class="muted" style="cursor:pointer">Отложенные цели (${dropped.length})</summary><div class="gcards" style="margin-top:10px">${dropped.map(goalCard).join('')}</div></details></section>` : ''}
    </div>`;
  }

  function viewSpheres() {
    const a = all(), t = todayKey();
    const last30 = {};
    for (let i = 0; i < 30; i++) { const c = a.days[addDays(t, -i)]; if (c) for (const s in c.by) last30[s] = (last30[s] || 0) + c.by[s]; }
    const last7 = {};
    for (let i = 0; i < 7; i++) { const c = a.days[addDays(t, -i)]; if (c) for (const s in c.by) last7[s] = (last7[s] || 0) + c.by[s]; }
    const focus = calcFor(t).focus;
    const cards = state.spheres.map((s) => {
      const xp = a.sphereXP[s.id] || 0, L = sphereLevel(xp);
      return `<div class="sphere-card" style="--sc:${color(s.id)}">
        <div class="top"><span class="ic">${s.icon}</span><span class="nm">${esc(s.name)}</span>${focus === s.id ? '<span class="x2">×2</span>' : ''}<span class="lvl">ур. ${L.lvl}</span></div>
        <div class="bar"><i style="width:${((xp - L.from) / (L.to - L.from)) * 100}%"></i></div>
        <div class="meta"><span>${xp} XP всего</span><span>${last7[s.id] || 0} XP за 7 дней</span></div>
      </div>`;
    }).join('');
    return kpis() + `<div class="grid g2">
      <section class="card">
        <h2>Колесо баланса</h2>
        <p class="lead">XP по сферам за последние 30 дней. Чем ровнее многоугольник, тем гармоничнее жизнь.</p>
        <div class="chart" id="radar" data-v='${JSON.stringify(last30)}'></div>
      </section>
      <section class="card">
        <h2>Как это работает</h2>
        <p class="lead" style="margin-bottom:8px">Каждое действие приносит XP своей сфере. У каждой сферы свой уровень.</p>
        <ul style="margin:0;padding-left:18px;font-size:14px;color:var(--ink-2)">
          <li><b>Сфера-фокус.</b> Сфера, которая за прошлую неделю набрала меньше всех, получает ×2 XP за привычки. Так игра мягко тянет к балансу.</li>
          <li><b>Гармония.</b> Особое достижение за то, что все сферы дошли до 3-го уровня.</li>
          <li>Названия и значки сфер меняются в настройках.</li>
        </ul>
      </section>
      <section class="card wide"><h2>Сферы жизни</h2><div class="spheres" style="margin-top:12px">${cards}</div></section>
    </div>`;
  }

  function drawRadar() {
    const box = document.getElementById('radar');
    if (!box) return;
    const v = JSON.parse(box.dataset.v || '{}');
    const S = state.spheres, N = S.length;
    const W = Math.min(box.clientWidth || 340, 420), H = W * 0.86;
    const cx = W / 2, cy = H / 2, R = Math.min(W, H) / 2 - 46;
    const max = Math.max(1, ...S.map((s) => Math.max(0, v[s.id] || 0)));
    const pt = (i, r) => { const ang = -Math.PI / 2 + (i / N) * Math.PI * 2; return [cx + Math.cos(ang) * r, cy + Math.sin(ang) * r]; };
    let g = '';
    [0.25, 0.5, 0.75, 1].forEach((f) => {
      g += `<polygon points="${S.map((_, i) => pt(i, R * f).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`;
    });
    S.forEach((s, i) => {
      const [x2, y2] = pt(i, R), [lx, ly] = pt(i, R + 22);
      g += `<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="var(--line)"/>`;
      const anchor = Math.abs(lx - cx) < 4 ? 'middle' : lx > cx ? 'start' : 'end';
      g += `<text x="${lx}" y="${ly + 4}" text-anchor="${anchor}" style="fill:var(--ink-2);font-size:12px">${s.icon} ${esc(s.name)}</text>`;
    });
    const poly = S.map((s, i) => pt(i, R * (Math.max(0, v[s.id] || 0) / max)).join(',')).join(' ');
    const dots = S.map((s, i) => { const [x, y] = pt(i, R * (Math.max(0, v[s.id] || 0) / max)); return `<circle cx="${x}" cy="${y}" r="5" fill="var(--c1)" stroke="var(--surface)" stroke-width="2" data-tip="${esc(`${s.icon} ${s.name}: ${v[s.id] || 0} XP за 30 дней`)}"/><circle cx="${x}" cy="${y}" r="14" fill="transparent" data-tip="${esc(`${s.icon} ${s.name}: ${v[s.id] || 0} XP за 30 дней`)}"/>`; }).join('');
    const empty = !S.some((s) => (v[s.id] || 0) > 0);
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="margin:0 auto">${g}
      ${empty ? `<text x="${cx}" y="${cy + 4}" text-anchor="middle" style="fill:var(--ink-3);font-size:13px">Пока нет данных</text>` : `<polygon points="${poly}" fill="var(--c1)" fill-opacity=".16" stroke="var(--c1)" stroke-width="2" stroke-linejoin="round"/>${dots}`}
    </svg>`;
  }

  function viewAwards() {
    const a = all();
    const got = ACH.filter(([id]) => state.ach[id]).length;
    const cards = ACH.map(([id, ic, nm, ds, fn]) => {
      const done = state.ach[id];
      const [cur, need] = fn(a);
      const p = Math.max(0, Math.min(1, cur / need));
      return `<div class="badge${done ? '' : ' locked'}"><div class="ic">${ic}</div><div class="nm">${nm}</div><div class="ds">${ds}</div>
        ${done ? `<div class="st">получено ${fmtShort(done)}</div>` : `<div class="bar"><i style="width:${p * 100}%"></i></div><div class="st">${Math.max(0, Math.min(cur, need))} / ${need}</div>`}</div>`;
    }).join('');
    return kpis() + `<section class="card"><h2>Достижения · ${got} из ${ACH.length}</h2><p class="lead">Награды за постоянство, рост и баланс.</p><div class="badges">${cards}</div></section>`;
  }

  function viewSettings() {
    const opts = (sel) => state.spheres.map((s) => `<option value="${s.id}"${s.id === sel ? ' selected' : ''}>${s.icon} ${esc(s.name)}</option>`).join('');
    const xpOpts = (sel) => [5, 10, 15, 20, 30].map((v) => `<option value="${v}"${v === sel ? ' selected' : ''}>+${v} XP</option>`).join('');
    const active = state.habits.filter((h) => !h.archived), archived = state.habits.filter((h) => h.archived);
    const penOpts = (sel) => PENALTIES.map((v) => `<option value="${v}"${v === sel ? ' selected' : ''}>−${v} XP</option>`).join('');
    const sbActive = state.setbacks.filter((s) => !s.archived), sbArchived = state.setbacks.filter((s) => s.archived);
    const sbRow = (s) => `<div class="set-row habit-set">
        <input type="text" value="${esc(s.name)}" data-bf="name" data-id="${s.id}" maxlength="80">
        <select data-bf="sphere" data-id="${s.id}">${opts(s.sphere)}</select>
        <select data-bf="pen" data-id="${s.id}">${penOpts(s.pen)}</select>
        ${s.archived ? `<button class="btn small" data-act="sbRestore" data-id="${s.id}">Вернуть</button>` : `<button class="btn small" data-act="sbArchive" data-id="${s.id}">В архив</button>`}
        <input type="text" class="ask" value="${esc(s.fix || '')}" data-bf="fix" data-id="${s.id}" maxlength="100" placeholder="🔁 Чем можно исправить. Пусто — исправить нельзя">
      </div>`;
    const habitRow = (h) => `<div class="set-row habit-set">
        <input type="text" value="${esc(h.name)}" data-hf="name" data-id="${h.id}" maxlength="80">
        <select data-hf="sphere" data-id="${h.id}">${opts(h.sphere)}</select>
        <select data-hf="xp" data-id="${h.id}">${xpOpts(h.xp)}</select>
        ${h.archived ? `<button class="btn small" data-act="restore" data-id="${h.id}">Вернуть</button>` : `<button class="btn small" data-act="archive" data-id="${h.id}">В архив</button>`}
        <input type="text" class="ask" value="${esc(h.ask || '')}" data-hf="ask" data-id="${h.id}" maxlength="100" placeholder="✎ Вопрос для заметки, например «Что узнал?». Пусто — без заметки">
      </div>`;
    return `<div class="grid g2">
      <section class="card wide">
        <h2>Режим</h2>
        <p class="lead">От режима зависят сферы, стартовые привычки, срывы, задания дня и шаблоны целей.
          При смене текущие привычки и срывы уходят в архив, а история и XP сохраняются.</p>
        <div class="seg">${Object.entries(MODES).map(([m, x]) => `<button class="${state.mode === m ? 'on' : ''}" data-act="switchMode" data-m="${m}">${x.name}</button>`).join('')}</div>
      </section>
      <section class="card">
        <h2>Минимум дня</h2>
        <p class="lead">Сколько XP нужно набрать, чтобы день засчитался как рост (+1%). Начните с малого: важна регулярность.</p>
        <div class="set-row"><input type="number" min="5" max="500" step="5" value="${state.settings.minXP}" data-sf="minXP" style="width:110px"> XP в день</div>
        <h2 style="margin-top:18px">Дата начала пути</h2>
        <p class="lead">С этого дня считается индекс.</p>
        <div class="set-row"><input type="text" value="${state.start}" data-sf="start" style="width:140px" placeholder="ГГГГ-ММ-ДД"></div>
      </section>
      <section class="card">
        <h2>Сферы жизни</h2>
        <p class="lead">Переименуйте под себя. Цвета закреплены, чтобы графики оставались читаемыми.</p>
        ${state.spheres.map((s) => `<div class="set-row"><span class="sw" style="background:${color(s.id)}"></span>
          <input type="text" class="emoji" value="${esc(s.icon)}" data-pf="icon" data-id="${s.id}" maxlength="4">
          <input type="text" value="${esc(s.name)}" data-pf="name" data-id="${s.id}" maxlength="30"></div>`).join('')}
      </section>
      <section class="card wide">
        <h2>Привычки</h2>
        <p class="lead">Изменения сохраняются сразу. Архив скрывает привычку из списка дня, но история и XP остаются.
          Если у привычки задан вопрос, после отметки под ней появится поле для заметки (+${NOTE_XP} XP). Все заметки собираются во вкладке «Отчёт».</p>
        ${active.map(habitRow).join('')}
        <form class="set-row habit-set" id="habitForm" style="margin-top:8px">
          <input type="text" id="hName" placeholder="Новая привычка" maxlength="80">
          <select id="hSphere">${opts('health')}</select>
          <select id="hXP">${xpOpts(10)}</select>
          <button class="btn primary" type="submit">Добавить</button>
          <input type="text" class="ask" id="hAsk" maxlength="100" placeholder="✎ Вопрос для заметки (необязательно)">
        </form>
        ${archived.length ? `<details style="margin-top:12px"><summary class="muted" style="cursor:pointer">Архив (${archived.length})</summary>${archived.map(habitRow).join('')}</details>` : ''}
      </section>
      <section class="card wide">
        <h2>🔻 Срывы и откаты</h2>
        <p class="lead">Что отбрасывает вас назад. Штраф снимается с XP дня и сферы. Если указать, чем срыв можно исправить, появится кнопка, которая снимает штраф.</p>
        ${sbActive.map(sbRow).join('')}
        <form class="set-row habit-set" id="sbForm" style="margin-top:8px">
          <input type="text" id="sName" placeholder="Новый срыв, например «Проспал»" maxlength="80">
          <select id="sSphere">${opts('health')}</select>
          <select id="sPen">${penOpts(10)}</select>
          <button class="btn primary" type="submit">Добавить</button>
          <input type="text" class="ask" id="sFix" maxlength="100" placeholder="🔁 Чем можно исправить (необязательно)">
        </form>
        ${sbArchived.length ? `<details style="margin-top:12px"><summary class="muted" style="cursor:pointer">Архив (${sbArchived.length})</summary>${sbArchived.map(sbRow).join('')}</details>` : ''}
      </section>
      <section class="card wide">
        <h2>Данные</h2>
        <p class="lead">Всё хранится только в этом браузере. Чтобы не потерять многолетнюю историю, иногда сохраняйте резервную копию.</p>
        <div class="row">
          <button class="btn" data-act="export">⬇ Сохранить копию (JSON)</button>
          ${canShareFiles() ? '<button class="btn" data-act="shareBackup">📤 Отправить копию (Telegram, почта, диск)</button>' : ''}
          <button class="btn" data-act="import">⬆ Загрузить из копии</button>
          <button class="btn danger" data-act="reset">Начать всё заново</button>
          <input type="file" id="importFile" accept="application/json,.json" hidden>
        </div>
      </section>
    </div>`;
  }

  // ---------- отрисовка ----------
  const main = document.getElementById('main');
  // статус дня на экране: с ним сравниваем после изменения, чтобы поймать момент «+1%»
  let shown = { k: null, s: null };
  function render() {
    shown = { k: viewDate, s: calcFor(viewDate).status };
    const views = { today: viewToday, goals: viewGoals, progress: viewProgress, report: viewReport, spheres: viewSpheres, awards: viewAwards, settings: viewSettings };
    if (!views[view]) view = 'today';
    if (!state.mode) { // первый запуск: выбор режима
      main.innerHTML = viewWelcome();
      document.querySelectorAll('#tabs button').forEach((b) => b.classList.remove('on'));
      return;
    }
    // запомнить поле ввода в фокусе, чтобы вернуть его после перерисовки
    const ae = document.activeElement;
    let fkey = null, sel = null;
    if (ae && main.contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) {
      fkey = ae.id ? '#' + ae.id : ae.dataset.field ? `[data-field="${ae.dataset.field}"]${ae.dataset.id ? `[data-id="${ae.dataset.id}"]` : ''}` : null;
      try { sel = [ae.selectionStart, ae.selectionEnd]; } catch (e) {}
    }
    main.innerHTML = views[view]();
    if (fkey) {
      const el = main.querySelector(fkey);
      if (el) { el.focus(); try { if (sel && sel[0] != null) el.setSelectionRange(sel[0], sel[1]); } catch (e) {} }
    }
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.v === view));
    drawGrowth(); drawHeat(); drawRadar(); renderNotes();
    hideTip();
  }

  // ---------- тема ----------
  let theme = 'auto';
  try { theme = localStorage.getItem(KEY + '.theme') || 'auto'; } catch (e) {}
  function applyTheme() {
    if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
    // цвет системной панели телефона под выбранную тему
    document.querySelectorAll('meta[name="theme-color"]').forEach((m) => {
      const dark = theme === 'auto' ? m.media.includes('dark') : theme === 'dark';
      m.content = dark ? '#121211' : '#f4f3ef';
    });
    const b = document.getElementById('themeBtn');
    b.textContent = theme === 'auto' ? '◐' : theme === 'light' ? '☀' : '☾';
    b.title = 'Тема: ' + (theme === 'auto' ? 'как в системе' : theme === 'light' ? 'светлая' : 'тёмная');
  }

  // ---------- действия ----------
  function afterChange(k, el) {
    const before = shown.k === k ? shown.s : null;
    save();
    const after = calcFor(k).status;
    if (before !== 'grow' && after === 'grow') {
      const r = el ? el.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 2, width: 0 };
      burst(r.left + r.width / 2, r.top);
      const yx = k > state.start ? calcFor(addDays(k, -1)).xp : 0;
      toast(calcFor(k).xp > yx && yx > 0 ? '🏆 +1%! Сегодня вы лучше, чем вчера' : '✅ +1%! Минимум дня выполнен');
    }
    render();
    checkAch(false);
  }
  // поздравление, если цель только что достигнута
  function goalCelebrate(g, wasDone, el) {
    const info = goalInfo(g);
    if (wasDone || !info.doneAt) return;
    const [ic, txt] = MEDALS[info.medal];
    const r = el && el.isConnected ? el.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 2, width: 0 };
    burst(r.left + r.width / 2, r.top, ['🏅', '🎯', '✨', '🎉']);
    setTimeout(() => toast(`${ic} Цель «${g.title}» достигнута ${txt}! +${GOAL_DONE_XP} XP`), 400);
  }
  const backupFile = () => new File([JSON.stringify(state, null, 2)], `plus-one-percent-${todayKey()}.json`, { type: 'application/json' });
  const canShareFiles = () => {
    try { return !!(navigator.canShare && navigator.canShare({ files: [new File(['{}'], 'x.json', { type: 'application/json' })] })); } catch (e) { return false; }
  };
  const toggleIn = (arr, id) => (arr.includes(id) ? arr.filter((x) => x !== id) : [...arr, id]);
  const ensureStart = (k) => { if (k < state.start) state.start = k; };

  const actions = {
    view: (el) => { view = el.dataset.v; try { localStorage.setItem(KEY + '.view', view); } catch (e) {} render(); window.scrollTo(0, 0); },
    prev: () => { viewDate = addDays(viewDate, -1); render(); },
    next: () => { viewDate = addDays(viewDate, 1); render(); },
    today: () => { viewDate = todayKey(); render(); },
    habit: (el) => { const d = dayMut(viewDate); ensureStart(viewDate); d.h = toggleIn(d.h || [], el.dataset.id); afterChange(viewDate, el); },
    quest: (el) => { const d = dayMut(viewDate); ensureStart(viewDate); d.q = toggleIn(d.q || [], el.dataset.id); afterChange(viewDate, el); },
    sb: (el) => {
      const d = dayMut(viewDate), id = el.dataset.id;
      ensureStart(viewDate);
      d.s = { ...(d.s || {}) };
      if (d.s[id]) delete d.s[id];
      else { d.s[id] = { fix: false, note: '' }; toast(`🔻 −${sbById(id).pen} XP. Честный счёт — уже шаг вперёд. Разберите, что случилось, и штраф уменьшится вдвое.`); }
      afterChange(viewDate, el);
    },
    sbFix: (el) => {
      const r = day(viewDate).s[el.dataset.id];
      r.fix = !r.fix;
      if (r.fix) toast('🔁 Штраф снят. Исправить ошибку — тоже рост.');
      afterChange(viewDate, el);
    },
    reroll: () => { const d = dayMut(viewDate); d.reroll = (d.reroll || 0) + 1; save(); render(); },
    rest: () => {
      const d = dayMut(viewDate); ensureStart(viewDate); d.rest = !d.rest;
      if (d.rest) toast('🛌 Отдыхайте. Восстановление тоже часть роста.');
      afterChange(viewDate);
    },
    delAction: (el) => { const d = dayMut(viewDate); d.a = (d.a || []).filter((a) => a.id !== el.dataset.id); afterChange(viewDate); },
    archive: (el) => { freezeFocus(); habitById(el.dataset.id).archived = true; save(); render(); },
    restore: (el) => { freezeFocus(); habitById(el.dataset.id).archived = false; save(); render(); },
    goalTpl: (el) => {
      goalDraft = goalTemplate(el.dataset.t); render();
      const f = document.getElementById('goalForm'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'center' });
    },
    goalCancel: () => { goalDraft = null; render(); },
    goalStep: (el) => {
      const g = goalById(el.dataset.id), was = !!goalInfo(g).doneAt;
      g.log = { ...(g.log || {}) };
      if (g.log[viewDate]) delete g.log[viewDate]; else g.log[viewDate] = g.type === 'sum' ? g.step : true;
      afterChange(viewDate, el); goalCelebrate(g, was, el);
    },
    goalDrop: (el) => { goalById(el.dataset.id).status = 'dropped'; save(); render(); toast('Цель отложена. Её история и XP сохранены.'); },
    goalRestore: (el) => { goalById(el.dataset.id).status = 'active'; save(); render(); },
    goalDelete: (el) => {
      const g = goalById(el.dataset.id);
      if (!confirm(`Удалить цель «${g.title}» вместе с историей? XP за её шаги тоже пропадёт. Чтобы сохранить историю, лучше нажать «Отказаться».`)) return;
      state.goals = state.goals.filter((x) => x !== g); save(); render();
    },
    goalHabit: (el) => {
      const g = goalById(el.dataset.id);
      freezeFocus(); state.habits.push({ id: 'h' + uid(), name: g.habit, sphere: g.sphere, xp: 10, ask: '', archived: false });
      save(); render(); toast(`📌 Привычка «${g.habit}» добавлена. Теперь результат нужно удержать.`);
    },
    sbArchive: (el) => { sbById(el.dataset.id).archived = true; save(); render(); },
    sbRestore: (el) => { sbById(el.dataset.id).archived = false; save(); render(); },
    theme: () => { theme = theme === 'auto' ? 'light' : theme === 'light' ? 'dark' : 'auto'; try { localStorage.setItem(KEY + '.theme', theme); } catch (e) {} applyTheme(); render(); },
    export: () => {
      const f = backupFile();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(f); a.download = f.name;
      a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    },
    // на телефоне: отправить копию через системное меню «Поделиться»
    shareBackup: async () => {
      try { await navigator.share({ files: [backupFile()], title: 'Копия «+1%»' }); }
      catch (e) { if (e.name !== 'AbortError') toast('Не удалось отправить. Используйте «Сохранить копию».'); }
    },
    install: async () => {
      if (!installPrompt) return;
      installPrompt.prompt();
      const { outcome } = await installPrompt.userChoice;
      installPrompt = null;
      document.getElementById('installBtn').hidden = true;
      if (outcome === 'accepted') toast('📲 Приложение установлено. Ищите значок «+1%» на рабочем столе.');
    },
    import: () => document.getElementById('importFile').click(),
    repPeriod: (el) => { rep.period = Number(el.dataset.p); render(); },
    repTag: (el) => { rep.tag = rep.tag === el.dataset.tag ? null : el.dataset.tag; render(); },
    repNotes: (el) => { rep.habit = el.dataset.id; rep.q = ''; render(); document.getElementById('notesCard').scrollIntoView({ behavior: 'smooth' }); },
    repRow: (el) => { rep.open[el.dataset.k] = !rep.open[el.dataset.k]; render(); },
    goDay: (el) => { viewDate = el.dataset.k; actions.view({ dataset: { v: 'today' } }); },
    csv: () => exportCSV(),
    addTag: (el) => {
      const ta = document.querySelector('textarea[data-field="journal"]');
      if (!ta) return;
      const tg = el.dataset.tag;
      if (!tagsOf(ta.value).includes(tg)) ta.value = (ta.value.trimEnd() + ' ' + tg).trimStart();
      dayMut(viewDate).j = ta.value; ensureStart(viewDate);
      afterChange(viewDate, el);
    },
    chooseMode: (el) => {
      applyMode(el.dataset.m); state.start = todayKey(); view = 'today'; save(); render();
      toast(el.dataset.m === 'school' ? '🎒 Готово! Отмечай, что сделал сегодня, и расти на 1% каждый день.' : '👤 Готово! Путь начинается сегодня.');
    },
    switchMode: (el) => {
      const m = el.dataset.m;
      if (m === state.mode) return;
      if (!confirm(`Переключить режим на «${MODES[m].name.slice(3)}»?\n\nСферы переименуются, привычки и срывы заменятся набором этого режима. Текущие привычки и срывы (в том числе ваши собственные) уйдут в архив, их можно вернуть. История, XP и цели сохранятся.`)) return;
      applyMode(m); save(); render(); toast(`Режим: ${MODES[m].name}`);
    },
    reset: () => {
      if (!confirm('Удалить всю историю, достижения и настройки и начать путь заново?')) return;
      state = fresh(); viewDate = todayKey(); save(); render(); toast('Новый путь начинается сегодня 🌱');
    },
  };

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (el && actions[el.dataset.act] && !el.disabled) actions[el.dataset.act](el, e);
  });

  document.addEventListener('submit', (e) => {
    e.preventDefault();
    if (e.target.id === 'actionForm') {
      const text = document.getElementById('aText').value.trim();
      if (!text) return;
      const d = dayMut(viewDate); ensureStart(viewDate);
      d.a = [...(d.a || []), { id: uid(), text, sphere: document.getElementById('aSphere').value, xp: Number(document.getElementById('aXP').value) }];
      afterChange(viewDate, e.target.querySelector('button'));
    } else if (e.target.id === 'habitForm') {
      const name = document.getElementById('hName').value.trim();
      if (!name) return;
      freezeFocus(); state.habits.push({ id: 'h' + uid(), name, sphere: document.getElementById('hSphere').value, xp: Number(document.getElementById('hXP').value), ask: document.getElementById('hAsk').value.trim(), archived: false });
      save(); render(); toast('Привычка добавлена');
    } else if (e.target.id === 'goalForm') {
      const r = draftParsed();
      if (r.err) { toast(r.err); return; }
      const g = { id: 'g' + uid(), ...r.ok, start: todayKey(), status: 'active', log: {} };
      state.goals.push(g);
      if (goalDraft.archiveHabit && goalDraft.archiveOn) { const h = habitById(goalDraft.archiveHabit); if (h) h.archived = true; }
      goalDraft = null; save(); render();
      toast(`🎯 Цель поставлена. Её задание уже ждёт на экране «Сегодня».`);
    } else if (e.target.id === 'sbForm') {
      const name = document.getElementById('sName').value.trim();
      if (!name) return;
      state.setbacks.push({ id: 's' + uid(), name, sphere: document.getElementById('sSphere').value, pen: Number(document.getElementById('sPen').value), fix: document.getElementById('sFix').value.trim(), archived: false });
      save(); render(); toast('Срыв добавлен в список');
    }
  });

  // дневник сохраняется на лету, без перерисовки, чтобы не сбивать курсор
  document.addEventListener('input', (e) => {
    if (e.target.dataset.field === 'journal') { dayMut(viewDate).j = e.target.value; ensureStart(viewDate); save(); }
    if (e.target.dataset.gf && goalDraft) {
      goalDraft[e.target.dataset.gf] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
      const pv = document.getElementById('goalPreview'); if (pv) pv.innerHTML = goalPreview();
    }
    if (e.target.dataset.field === 'sbnote') {
      const r = (day(viewDate).s || {})[e.target.dataset.id];
      if (r) { r.note = e.target.value; save(); }
    }
    if (e.target.dataset.field === 'note') {
      const d = dayMut(viewDate);
      d.n = { ...(d.n || {}), [e.target.dataset.id]: e.target.value };
      save();
    }
    if (e.target.id === 'noteSearch') { rep.q = e.target.value; renderNotes(); }
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    // с задержкой: если поле потеряло фокус из-за щелчка по кнопке, щелчок успеет сработать до перерисовки
    if (t.dataset.gf) return; // черновик цели обновляется на лету в обработчике input
    if (t.dataset.field === 'goalval') {
      const g = goalById(t.dataset.id), was = !!goalInfo(g).doneAt, v = nval(t.value);
      g.log = { ...(g.log || {}) };
      if (t.value.trim() === '') delete g.log[viewDate];
      else if (isFinite(v)) g.log[viewDate] = v;
      else { toast('Введите число, например 94,5'); render(); return; }
      const k = viewDate;
      setTimeout(() => { afterChange(k); goalCelebrate(g, was); }, 200);
      return;
    }
    if (t.dataset.prof) {
      const f = t.dataset.prof, v = t.value.trim();
      if (['wake', 'bed'].includes(f)) {
        if (v && toMin(v) === null) { toast('Время пишется как ЧЧ:ММ, например 07:00'); render(); return; }
        state.profile[f] = v ? fmtMin(toMin(v)) : '';
      } else {
        if (v && !(nval(v) > 0)) { toast('Нужно положительное число'); render(); return; }
        state.profile[f] = v ? nval(v) : '';
      }
      save(); render(); return;
    }
    if (t.dataset.field === 'journal' || t.dataset.field === 'note' || t.dataset.field === 'sbnote') { const k = viewDate; setTimeout(() => afterChange(k), 200); return; }
    if (t.id === 'noteHabit') { rep.habit = t.value; render(); return; }
    if (t.dataset.hf) {
      freezeFocus();
      const h = habitById(t.dataset.id);
      if (t.dataset.hf === 'name') { if (t.value.trim()) h.name = t.value.trim(); }
      else h[t.dataset.hf] = t.dataset.hf === 'xp' ? Number(t.value) : t.dataset.hf === 'ask' ? t.value.trim() : t.value;
      save(); render();
    } else if (t.dataset.bf) {
      const s = sbById(t.dataset.id), f = t.dataset.bf;
      if (f === 'name') { if (t.value.trim()) s.name = t.value.trim(); }
      else s[f] = f === 'pen' ? Number(t.value) : f === 'fix' ? t.value.trim() : t.value;
      save(); render();
    } else if (t.dataset.pf) {
      const s = state.spheres.find((x) => x.id === t.dataset.id);
      if (t.value.trim()) s[t.dataset.pf] = t.value.trim();
      save(); render();
    } else if (t.dataset.sf === 'minXP') {
      const v = Math.round(Number(t.value));
      if (v >= 5 && v <= 500) { state.settings.minXP = v; save(); }
      render();
    } else if (t.dataset.sf === 'start') {
      if (/^\d{4}-\d{2}-\d{2}$/.test(t.value) && !isNaN(dateOf(t.value)) && t.value <= todayKey()) { state.start = t.value; save(); toast('Дата начала изменена'); }
      else toast('Формат даты: ГГГГ-ММ-ДД, не позже сегодня');
      render();
    } else if (t.id === 'importFile' && t.files[0]) {
      t.files[0].text().then((txt) => {
        const data = JSON.parse(txt);
        if (!data || typeof data.days !== 'object' || !Array.isArray(data.habits) || !Array.isArray(data.spheres)) throw new Error('bad');
        if (!confirm('Заменить текущие данные содержимым файла?')) return;
        state = { ...fresh(), ...data, settings: { ...fresh().settings, ...data.settings } };
        migrate(); freezeFocus();
        save(); render(); toast('Данные загружены');
      }).catch(() => toast('Не удалось прочитать файл: это не копия «+1%»'));
    }
  });

  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { drawGrowth(); drawHeat(); drawRadar(); }, 150); });
  // смена суток, пока страница открыта
  let lastToday = todayKey();
  setInterval(() => { if (todayKey() !== lastToday) { if (viewDate === lastToday) viewDate = todayKey(); lastToday = todayKey(); calc = null; gcache = {}; render(); } }, 60000);

  // ---------- приложение (PWA) ----------
  let installPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); installPrompt = e;
    document.getElementById('installBtn').hidden = false;
  });
  window.addEventListener('appinstalled', () => { installPrompt = null; document.getElementById('installBtn').hidden = true; });
  // сервис-воркер работает только по HTTPS или на localhost
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  // просим браузер не очищать данные при нехватке места
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  freezeFocus();
  applyTheme();
  render();
  checkAch(true);
})();
</script>
</body>
</html>
